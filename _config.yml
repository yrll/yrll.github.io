# Site settings
title: "yrll"
description: "A resume for rulan."

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Resume settings
resume_avatar:                  "true"
resume_name:                    "Rulan Yang"
resume_title:                   ":)"

# used for the contact button in _layouts/resume.html
resume_contact_email:           "rulan.yang.xmu@outlook.com"

# the next two items are used for schema itemprops in _layouts/resume.html
resume_contact_telephone:       "(+86) 18786082829"
resume_contact_address:         "Xiangan South Road, Xiamen, Fujian, China"

resume_header_contact_info:     "Xiangan South Road, Xiamen, Fujian, China • (+86) 18786082829 • rulan.yang.xmu@outlook.com"
display_header_contact_info:    "false"

resume_header_intro: "<p>Hi, I'm Rulan Yang, a third-year Ph.D. student in the Department of Computer Science, Xiamen University, advised by Professor Qiao Xiang. Before that, I obtained my Bachelor's degree from Xiamen University. My research interests include network verification and formal method, with current research focusing on network configuration diagnosis.</p>"

# use "yes" to display the email contact button,
# "no" to display an "I'm not looking for work" message,
# or remove the resume_looking_for_work option entirely
# to leave blank
resume_looking_for_work:        "yes"

# Decide which sections to use
# comment out to hide
# resume_section_experience:      true
resume_section_education:       true
resume_section_projects:        true
resume_section_skills:          true
resume_section_recognition:     false
resume_section_links:           true
resume_section_associations:    false
# resume_section_interests:       true

# Resume social links
# uncomment the options you wish to display, and add your own URL
resume_social_links:
  resume_github_url:            "https://github.com/yrll"
  # resume_twitter_url:           "http://twitter.com/jglovier"
  # resume_dribbble_url:          "https://dribbble.com/jag"
  # resume_facebook_url:          "insert Facebook URL here"
  # resume_linkedin_url:          "https://www.linkedin.com/in/joelglovier"
  # resume_instagram_url:         "insert your Instagram URL here"
  # resume_website_url:           "http://joelglovier.com"
  # resume_medium_url:            "https://medium.com/@jglovier"
resume_print_social_links:      true

# Design settings
resume_theme:                   default

